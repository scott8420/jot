<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- jot: a page with a folded corner and two jotted lines. currentColor
       throughout, and NO width/height on the root (a declared size would pin the
       drawing to that many pixels regardless of the box GTK asks for; see
       docs/resources-and-dialog-lifetime.md), so GTK's symbolic pipeline
       recolours it to the theme foreground.
       NOTE: no double hyphen anywhere in here. XML forbids it inside a comment
       and glib-compile-resources parses the SVG, so it is a build error. -->
  <g fill="none" stroke="currentColor" stroke-width="1.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.2 1.7H4.7A1.6 1.6 0 0 0 3.1 3.3v9.4a1.6 1.6 0 0 0 1.6 1.6h6.6a1.6 1.6 0 0 0 1.6-1.6V5.5Z"/>
    <path d="M9.2 1.7v3.8h3.7"/>
    <path d="M5.8 8.3h4.4"/>
    <path d="M5.8 10.9h2.8"/>
  </g>
</svg>
